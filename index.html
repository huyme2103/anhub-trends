<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AnHub Trends Feed</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #070b16;
        color: #e6ecff;
        font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main { max-width: 640px; padding: 32px; }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { margin: 0 0 16px; color: #9aa7c7; }
      a { color: #3882f6; }
      code {
        background: #151b2d;
        border: 1px solid #27314b;
        border-radius: 6px;
        padding: 2px 6px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>AnHub · Last30Days trend feed</h1>
      <p>
        Read-only JSON feed generated by the AnHub trend pipeline
        (Last30Days v3.39.0, keyless sources).
      </p>
      <p>
        <a href="./trends/latest.json">trends/latest.json</a>
      </p>
      <p>Schema <code>1.0</code> · refreshed daily by GitHub Actions.</p>
    </main>
  </body>
</html>
